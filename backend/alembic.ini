[alembic]
script_location = alembic
version_locations = alembic/versions
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/pagemark

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console
console = ExtFileHandler

[formatters]
keys = generic
generic = GenericFormatter

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-8.8s [%(asctime)s] %(name)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S
